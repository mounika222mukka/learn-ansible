- name: demo on loops
  hosts: local
  connection: local
  become: yes
  vars:
   packages:
   - { name= 'nginx', state= 'absent'}
   - { name= 'mysql', state= 'present'}
   - { name= 'git', state= 'absent'}
   - { name= 'htop', state= 'present'}
  tasks:
  - name: install packages
    package:
      name: "{{item}}"
      state: present
    loop: "{{packages}}"
    