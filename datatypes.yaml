- name: Course information
  hosts: local
  connection: local
  vars:
   course: "AIops with DevOps on AWS"
   Duration_in_hours: 150
   Is_Live_Sessions: true
   Topics: 
   - linux
   - shell
   - ansible
   - terraform
   more_details:
     trainer: SIva
     months: 4

  tasks:
  - name: print info and type
    debug:
      msg: "{{course}} : {{course | type_debug}} "
      duration: "{{Duration_in_hours }} : {{Duration_in_hours | type_debug}}"
      is Is_Live_Sessions: "{{Is_Live_Sessions}} : {{Is_Live_Sessions | type_debug}}"
      more_details: "{{more_details}} : {{more_details |type_debug}}"

