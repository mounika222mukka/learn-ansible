- name: Shell vs command
  hosts: local
  connection: local
  tasks:
  - name: test the command module
    #command: cat /etc/passwd | grep ec2-user
    shell: cat /etc/passwd | grep ec2-user
    register: ec2_User_output

  - name: print the output 
    debug: 
      msg: " {{ec2_User_output}} "

  - name: get the files
    command: ls -l > /tmp/files.txt
    register: output.txt
  - name: Print the output
    debug:
      msg: "{{output.txt}}"  
  